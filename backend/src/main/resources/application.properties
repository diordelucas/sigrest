# =====================================================
# Configuração do banco de dados - PostgreSQL Local e Docker
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigrest_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# =====================================================
# Configuração do Hibernate (JPA)
# =====================================================
# O schema e' gerido pelo Flyway (db/migration/*.sql) desde esta versao. "validate" apenas
# confere que o schema bate com as entidades no boot - nunca altera o banco sozinho (ao
# contrario do antigo "update", que reescrevia producao silenciosamente a cada deploy).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =====================================================
# Flyway (migracoes versionadas de schema)
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate + baseline-version=1: bancos existentes (com as tabelas ja criadas pelo
# antigo ddl-auto=update) sao marcados como "ja na V1" sem reexecutar o CREATE TABLE - so V2 em
# diante roda. Um banco novo/vazio (docker volume limpo, CI) nao aciona o baseline: V1 e V2
# rodam normalmente do zero.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =====================================================
# Configurações adicionais
# =====================================================
spring.jpa.open-in-view=false
server.port=8080

# Incluir mensagem de erro nas respostas HTTP (para feedback útil no frontend)
server.error.include-message=always

# =====================================================
# Segurança
# =====================================================
api.security.token.secret=${JWT_SECRET:sigrest-dev-secret-trocar-em-producao}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:8}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Administrador inicial (criado apenas se ainda não existir)
app.admin.email=${ADMIN_EMAIL:admin@admin.com}
app.admin.password=${ADMIN_PASSWORD:admin123}